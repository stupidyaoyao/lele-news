name: Publish site

# When code changes (not the hourly news), publish the app again, keeping the recordings already online.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/site.sh prepare && ./scripts/site.sh publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
