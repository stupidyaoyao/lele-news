name: Update news

on:
  schedule:
    - cron: '7 * * * *'   # every hour at :07 (GitHub may delay a few minutes)
  workflow_dispatch:          # lets you run it manually from the Actions tab

permissions:
  contents: write

concurrency:
  group: site-publish
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch and summarise news
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/fetch.mjs
      - name: Commit news.json
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "Update news $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase -X theirs || (git rebase --abort; git pull --no-rebase -X ours --no-edit)
          git push

      # ---- recordings (so listening keeps going with the screen off) + publish the site ----
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-audio.txt
      - name: Voice models (cached)
        uses: actions/cache@v4
        with:
          path: .voice
          key: voice-kokoro-v1.0
      - name: Make recordings
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VOICE_MODELS: .voice
        run: |
          sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install -q -r scripts/requirements-audio.txt
          mkdir -p .voice
          for f in kokoro-v1.0.onnx voices-v1.0.bin; do
            [ -f .voice/$f ] || curl -sSL -o .voice/$f https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/$f
          done
          ./scripts/site.sh prepare
          python scripts/audio.py _site/audio || echo "Recordings failed (the site is still published)"
      - name: Publish site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/site.sh publish
