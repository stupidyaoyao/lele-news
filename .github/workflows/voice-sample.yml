name: Voice sample (one-off)
on: workflow_dispatch
permissions: { contents: write }
jobs:
  sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: sudo apt-get install -y -qq ffmpeg >/dev/null
      - run: node scripts/voice-sample.mjs
        env: { GEMINI_API_KEY: '${{ secrets.GEMINI_API_KEY }}' }
      - run: |
          rm -f samples/g.pcm
          git config user.name "news-bot"; git config user.email "news-bot@users.noreply.github.com"
          git add samples/ && git commit -m "Voice samples" && git pull --rebase -X theirs && git push || echo "nothing to commit"
