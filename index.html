<!DOCTYPE html>
<html lang="zh-CN" data-theme="auto" data-size="normal">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>乐乐新闻 Happy News</title>
<meta name="description" content="每天10分钟，看完或听完你要的新闻">
<meta name="theme-color" content="#c2410c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="乐乐新闻">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<script>
  // apply saved look before first paint (no flash)
  try {
    var p = JSON.parse(localStorage.getItem('look') || localStorage.getItem('profile') || '{}');
    document.documentElement.dataset.theme = p.theme || 'auto';
    document.documentElement.dataset.size = p.size || 'normal';
  } catch (e) {}
</script>
<link rel="stylesheet" href="css/app.css?v=14">
</head>
<body>
<div class="wrap" id="main">
  <header class="top">
    <div class="brand">
      <h1>乐乐新闻<small>Happy News</small></h1>
      <div class="sub" id="updated">加载中…</div>
    </div>
    <div class="streak" id="streak">🔥 0 天</div>
    <button class="icon-btn" data-action="open-search" aria-label="搜索">🔍</button>
    <button class="icon-btn" data-action="open-settings" aria-label="设置">⚙️</button>
  </header>

  <section class="gold" id="gold" hidden></section>

  <div class="chips" id="chips"></div>

  <nav class="tabs" id="tabs">
    <button class="tab on" data-tab="digest">今日要闻</button>
    <button class="tab tab-live" data-tab="live">即时</button>
    <button class="tab" data-tab="mine">👤 我的</button>
  </nav>

  <main id="view"></main>
</div>

<div class="player" id="player">
  <div class="in">
    <button class="play" id="play">🎧 收听</button>
    <button class="btn" id="next" hidden>下一条</button>
    <div class="now" id="now">把今日要闻读给你听</div>
    <button class="btn" id="speed">1x</button>
  </div>
</div>

<div class="overlay" id="reader" hidden></div>
<div class="overlay" id="search" hidden></div>
<div class="overlay" id="settings" hidden></div>
<div class="overlay onb" id="onboarding" hidden></div>
<div class="modal-bg" id="modal" hidden></div>
<div class="toast" id="toast"></div>

<script src="js/config.js?v=14"></script>
<script src="js/app.js?v=14"></script>
</body>
</html>
